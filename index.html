<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق OBAA - نتائج الطلاب</title>
    <!-- خط كايرو -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- مكتبات Firebase الإصدار 8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #fff3eb; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .card { background: #ffffff; width: 100%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 25px rgba(255, 107, 0, 0.15); padding: 25px; text-align: center; }
        h1 { color: #ff6b00; font-size: 32px; font-weight: 900; margin-bottom: 5px; }
        p { color: #777; font-size: 13px; font-weight: 700; margin-bottom: 20px; }
        .input-group { text-align: right; margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 700; color: #444; margin-bottom: 5px; }
        input { width: 100%; padding: 14px; border: 2px solid #ffe0cc; border-radius: 12px; font-size: 16px; font-weight: 700; text-align: center; outline: none; background: #fffaf7; }
        input:focus { border-color: #ff6b00; }
        button { width: 100%; padding: 14px; background: #ff6b00; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 107, 0, 0.3); }
        button:active { transform: scale(0.98); }
        .result-box { display: none; margin-top: 20px; padding: 15px; background: #fff8f3; border: 2px solid #ffd8c2; border-radius: 14px; text-align: right; }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
        .error-box { display: none; margin-top: 15px; padding: 12px; background: #fff0f0; color: #d32f2f; border-radius: 10px; font-size: 13px; font-weight: 700; }
    </style>
</head>
<body>

    <div class="card">
        <h1>OBAA</h1>
        <p>نظام نتائج الطلاب الإلكتروني</p>

        <div class="input-group">
            <label>أدخل رمز الطالب:</label>
            <input type="text" id="studentCode" value="OBAA1234">
        </div>

        <button onclick="fetchResult()">عرض النتيجة 🚀</button>

        <div id="errorBox" class="error-box"></div>

        <div id="resultBox" class="result-box">
            <div style="text-align:center; color:#ff6b00; font-weight:800; margin-bottom:10px;">بطاقة النتيجة 🎓</div>
            <div class="result-row"><span>اسم الطالب:</span> <span id="resName">-</span></div>
            <div class="result-row"><span>الصف:</span> <span id="resGrade">-</span></div>
            <div class="result-row"><span>المعدل:</span> <span id="resGpa" style="color:#ff6b00;">-</span></div>
        </div>
    </div>

    <script>
        // إعدادات Firebase الخاصة بمشروعك
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function fetchResult() {
            const code = document.getElementById('studentCode').value.trim();
            const resBox = document.getElementById('resultBox');
            const errBox = document.getElementById('errorBox');

            resBox.style.display = 'none';
            errBox.style.display = 'none';

            if (!code) {
                errBox.textContent = 'الرجاء إدخال الرمز.';
                errBox.style.display = 'block';
                return;
            }

            db.ref('students/' + code).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    document.getElementById('resName').textContent = data.name || '-';
                    document.getElementById('resGrade').textContent = data.grade || 'الثامن الأساسي';
                    document.getElementById('resGpa').textContent = data.gpa || '-';
                    resBox.style.display = 'block';
                } else {
                    errBox.textContent = 'رمز الطالب غير صحيح أو لم تعلن النتيجة.';
                    errBox.style.display = 'block';
                }
            }).catch(() => {
                errBox.textContent = 'خطأ في الاتصال بقاعدة البيانات.';
                errBox.style.display = 'block';
            });
        }
    </script>
</body>
</html>
