<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة تحكم الأساتذة - OBAA</title>
    <!-- خط كايرو العربي المميز -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --primary-orange: #ff6b00;
            --gradient-orange: linear-gradient(135deg, #ff8c00, #ff5500);
            --bg-gradient: linear-gradient(180deg, #fff3eb 0%, #f4f6f9 100%);
            --card-shadow: 0 15px 35px rgba(255, 107, 0, 0.15);
            --text-dark: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: var(--text-dark);
        }

        .mobile-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 28px;
            box-shadow: var(--card-shadow);
            padding: 25px 20px;
            text-align: center;
            border: 1px solid rgba(255, 107, 0, 0.1);
            position: relative;
            overflow: hidden;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
        }

        .mobile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: var(--gradient-orange);
        }

        .brand-header {
            margin-bottom: 15px;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 900;
            background: var(--gradient-orange);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .brand-subtitle {
            font-size: 13px;
            font-weight: 700;
            color: #777;
            margin-top: 4px;
        }

        .connection-status {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            background: #fff3eb;
            color: var(--primary-orange);
        }

        .form-container {
            text-align: right;
            overflow-y: auto;
            flex-grow: 1;
            padding-left: 4px;
            padding-right: 4px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #444;
            margin-bottom: 5px;
            padding-right: 4px;
        }

        .custom-input, .custom-select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #ffe0cc;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            text-align: right;
            outline: none;
            background-color: #fffaf7;
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        .custom-input:focus, .custom-select:focus {
            border-color: var(--primary-orange);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.15);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background: var(--gradient-orange);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 107, 0, 0.3);
            transition: all 0.2s ease;
            margin-top: 5px;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .alert-box {
            display: none;
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
        }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .students-list-section {
            margin-top: 20px;
            text-align: right;
            border-top: 2px dashed #ffe0cc;
            padding-top: 15px;
        }

        .list-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--primary-orange);
            margin-bottom: 10px;
        }

        .table-container {
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid #ffe0cc;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: right;
        }

        th, td {
            padding: 8px 10px;
            border-bottom: 1px solid #ffe0cc;
        }

        th {
            background-color: #fff4ec;
            color: #e05d00;
            font-weight: 800;
            position: sticky;
            top: 0;
        }

        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .app-footer {
            margin-top: 15px;
            font-size: 11px;
            font-weight: 700;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="mobile-card">
        <div class="brand-header">
            <div class="brand-title">OBAA</div>
            <div class="brand-subtitle">لوحة تحكم الأساتذة وإدارة النتائج</div>
        </div>

        <div id="connectionStatus" class="connection-status">جاري الاتصال بقاعدة البيانات... 🔄</div>

        <div class="form-container">
            <div id="alertBox" class="alert-box"></div>

            <form id="teacherForm" onsubmit="saveStudent(event)">
                <div class="input-group">
                    <label class="input-label">رمز الطالب (الكود):</label>
                    <input type="text" id="studentCode" class="custom-input" placeholder="مثال: 1001" required autocomplete="off">
                </div>

                <div class="input-group">
                    <label class="input-label">اسم الطالب الثلاثي:</label>
                    <input type="text" id="studentName" class="custom-input" placeholder="أدخل اسم الطالب الكامل" required autocomplete="off">
                </div>

                <div class="input-group">
                    <label class="input-label">الصف الدراسي:</label>
                    <input type="text" id="studentGrade" class="custom-input" value="الثامن الأساسي" required>
                </div>

                <div class="input-group">
                    <label class="input-label">المعدل العام (%):</label>
                    <input type="number" id="studentGpa" class="custom-input" step="0.1" min="0" max="100" placeholder="مثال: 95.5" required>
                </div>

                <div class="input-group">
                    <label class="input-label">التقدير:</label>
                    <select id="studentStatus" class="custom-select">
                        <option value="ممتاز">ممتاز</option>
                        <option value="جيد جداً">جيد جداً</option>
                        <option value="جيد">جيد</option>
                        <option value="مقبول">مقبول</option>
                    </select>
                </div>

                <button type="submit" class="action-btn">حفظ النتيجة في النظام 💾</button>
            </form>

            <div class="students-list-section">
                <div class="list-title">📋 الطلاب المسجلين حالياً</div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>الكود</th>
                                <th>الاسم</th>
                                <th>المعدل</th>
                                <th>إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="studentsTableBody">
                            <tr><td colspan="4" style="text-align: center; color: #888;">جاري التحميل...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="app-footer">تطبيق OBAA - لوحة الأساتذة</div>
    </div>

    <script>
        // إعدادات Firebase الخاصة بك (نفس قاعدة البيانات ليرتبط مع تطبيق الطلاب مباشرة)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const studentsRef = db.ref('students');

        // حالة الاتصال
        db.ref('.info/connected').on('value', (snap) => {
            const statusEl = document.getElementById('connectionStatus');
            if (snap.val() === true) {
                statusEl.textContent = "متصل بقاعدة البيانات 🟢";
                statusEl.style.color = "#28a745";
                statusEl.style.background = "#d4edda";
            } else {
                statusEl.textContent = "منقطع عن الاتصال 🔴";
                statusEl.style.color = "#dc3545";
                statusEl.style.background = "#f8d7da";
            }
        });

        // حفظ الطالب
        function saveStudent(e) {
            e.preventDefault();
            const code = document.getElementById('studentCode').value.trim();
            const name = document.getElementById('studentName').value.trim();
            const grade = document.getElementById('studentGrade').value.trim();
            const gpa = document.getElementById('studentGpa').value.trim() + "%";
            const status = document.getElementById('studentStatus').value;

            studentsRef.child(code).set({ name, grade, gpa, status }, (error) => {
                if (error) {
                    showAlert('حدث خطأ أثناء الحفظ: ' + error.message, 'danger');
                } else {
                    showAlert('تم حفظ النتيجة بنجاح! 🚀', 'success');
                    document.getElementById('teacherForm').reset();
                    document.getElementById('studentGrade').value = "الثامن الأساسي";
                }
            });
        }

        // جلب البيانات وعرضها في الجدول المدمج
        studentsRef.on('value', (snapshot) => {
            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '';

            if (!snapshot.exists()) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #888;">لا توجد نتائج مسجلة.</td></tr>';
                return;
            }

            snapshot.forEach((child) => {
                const code = child.key;
                const data = child.val();
                tbody.innerHTML += `
                    <tr>
                        <td><b>${code}</b></td>
                        <td>${data.name}</td>
                        <td><b>${data.gpa}</b></td>
                        <td><button class="delete-btn" onclick="deleteStudent('${code}')">حذف</button></td>
                    </tr>
                `;
            });
        });

        // حذف طالب
        function deleteStudent(code) {
            if (confirm(`هل أنت متأكد من حذف الطالب رقم (${code})؟`)) {
                studentsRef.child(code).remove()
                    .then(() => showAlert('تم الحذف بنجاح.', 'success'))
                    .catch((err) => showAlert('خطأ في الحذف: ' + err.message, 'danger'));
            }
        }

        // إظهار التنبيهات المؤقتة
        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            box.className = `alert-box alert-${type}`;
            box.textContent = msg;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
