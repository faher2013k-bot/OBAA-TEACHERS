<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق OBAA - نتائج الطلاب</title>
    <!-- خط كايرو العربي المميز -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --primary-orange: #ff6b00;
            --gradient-orange: linear-gradient(135deg, #ff8c00, #ff5500);
            --bg-gradient: linear-gradient(180deg, #fff3eb 0%, #f4f6f9 100%);
            --card-shadow: 0 15px 35px rgba(255, 107, 0, 0.15);
            --text-dark: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: var(--text-dark);
        }

        .mobile-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 28px;
            box-shadow: var(--card-shadow);
            padding: 30px 24px;
            text-align: center;
            border: 1px solid rgba(255, 107, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .mobile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: var(--gradient-orange);
        }

        .brand-header {
            margin-bottom: 25px;
        }

        .brand-title {
            font-size: 38px;
            font-weight: 900;
            background: var(--gradient-orange);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .brand-subtitle {
            font-size: 14px;
            font-weight: 700;
            color: #777;
            margin-top: 6px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #444;
            margin-bottom: 8px;
            padding-right: 4px;
        }

        .custom-input {
            width: 100%;
            padding: 16px;
            border: 2px solid #ffe0cc;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            outline: none;
            background-color: #fffaf7;
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            border-color: var(--primary-orange);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.15);
        }

        .search-btn {
            width: 100%;
            padding: 16px;
            background: var(--gradient-orange);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 107, 0, 0.3);
            transition: all 0.2s ease;
        }

        .search-btn:active {
            transform: scale(0.98);
            box-shadow: 0 4px 10px rgba(255, 107, 0, 0.2);
        }

        .result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #fff8f3;
            border: 2px solid #ffd8c2;
            border-radius: 20px;
            text-align: right;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-orange);
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px dashed #ffd8c2;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .result-row:last-child {
            margin-bottom: 0;
        }

        .row-label {
            font-weight: 700;
            color: #666;
        }

        .row-value {
            font-weight: 800;
            color: #111;
        }

        .status-badge {
            background: var(--gradient-orange);
            color: #fff;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
        }

        .error-box {
            display: none;
            margin-top: 18px;
            padding: 14px;
            background: #fff0f0;
            border: 1px solid #ffcdd2;
            color: #d32f2f;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
        }

        .app-footer {
            margin-top: 25px;
            font-size: 12px;
            font-weight: 700;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="mobile-card">
        <div class="brand-header">
            <div class="brand-title">OBAA</div>
            <div class="brand-subtitle">نظام نتائج الطلاب الإلكتروني</div>
        </div>

        <div class="input-group">
            <label class="input-label" for="studentCode">أدخل رمز الطالب الخاص بك:</label>
            <input type="text" id="studentCode" class="custom-input" placeholder="مثال: 1001" autocomplete="off" inputmode="numeric">
        </div>

        <button class="search-btn" onclick="fetchResult()">عرض النتيجة 🚀</button>

        <div id="errorBox" class="error-box"></div>

        <div id="resultBox" class="result-box">
            <div class="result-title">بطاقة النتيجة الرسمية 🎓</div>
            <div class="result-row">
                <span class="row-label">اسم الطالب:</span>
                <span class="row-value" id="resName">-</span>
            </div>
            <div class="result-row">
                <span class="row-label">الصف الدراسي:</span>
                <span class="row-value" id="resGrade">-</span>
            </div>
            <div class="result-row">
                <span class="row-label">المعدل العام:</span>
                <span class="row-value" id="resGpa" style="color: var(--primary-orange); font-size: 18px;">-</span>
            </div>
            <div class="result-row">
                <span class="row-label">التقدير:</span>
                <span class="status-badge" id="resStatus">-</span>
            </div>
        </div>

        <div class="app-footer">تطبيق OBAA - جميع الحقوق محفوظة</div>
    </div>

    <script>
        // 1. ضع بيانات مشروعك الخاصة بـ Firebase هنا
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // تهيئة الفايربيس
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        function fetchResult() {
            const codeInput = document.getElementById('studentCode').value.trim();
            const resultBox = document.getElementById('resultBox');
            const errorBox = document.getElementById('errorBox');

            resultBox.style.display = 'none';
            errorBox.style.display = 'none';

            if (!codeInput) {
                errorBox.textContent = 'يرجى إدخال رمز الطالب أولاً.';
                errorBox.style.display = 'block';
                return;
            }

            // البحث في مسار الطلاب بالفايربيس
            database.ref('students/' + codeInput).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    document.getElementById('resName').textContent = data.name || '-';
                    document.getElementById('resGrade').textContent = data.grade || 'الثامن الأساسي';
                    document.getElementById('resGpa').textContent = data.gpa || '-';
                    document.getElementById('resStatus').textContent = data.status || 'ناجح';

                    resultBox.style.display = 'block';
                } else {
                    errorBox.textContent = 'رمز الطالب غير صحيح أو لم تعلن النتيجة بعد.';
                    errorBox.style.display = 'block';
                }
            }).catch((error) => {
                errorBox.textContent = 'حدث خطأ في الاتصال بقاعدة البيانات.';
                errorBox.style.display = 'block';
            });
        }
    </script>
</body>
</html>
